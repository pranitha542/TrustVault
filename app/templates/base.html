<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TrustVault private document workspace">
    <title>{{ page_title }} · TrustVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/app.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark vault-nav">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/dashboard">TrustVault</a>
            {% if user is defined and user %}
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="/dashboard">Documents</a>
                    {% if user.role == "administrator" %}
                    <a class="nav-link" href="/audit">Audit events</a>
                    {% endif %}
                </div>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <span class="small text-white-50">{{ user.username }} · {{ user.role|capitalize }}</span>
                    <button class="btn btn-outline-light btn-sm" type="button" data-logout>Log out</button>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4 py-lg-5">
        <div id="feedback" class="alert d-none" role="status" aria-live="polite" tabindex="-1"></div>
        {% block content %}{% endblock %}
    </main>

    <footer class="container pb-4 text-secondary small">
        TrustVault · Private files are available only through authorized routes.
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
